name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - name: Locate static output
        id: out
        run: |
          if [ -f dist/client/index.html ]; then echo "dir=dist/client" >> "$GITHUB_OUTPUT"
          elif [ -f dist/client/_shell.html ]; then echo "dir=dist/client" >> "$GITHUB_OUTPUT"
          elif [ -f dist/index.html ]; then echo "dir=dist" >> "$GITHUB_OUTPUT"
          elif [ -f .output/public/index.html ]; then echo "dir=.output/public" >> "$GITHUB_OUTPUT"
          else echo "No static index.html" && ls -la dist dist/client 2>/dev/null; exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.out.outputs.dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
